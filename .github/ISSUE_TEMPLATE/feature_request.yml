name: Feature request
description: Suggest an improvement to Conflux.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain what you are trying to do and what is missing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe a possible solution or workflow.
    validations:
      required: true
