name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start the app...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your OS, browser, and Node.js version.
    validations:
      required: true
