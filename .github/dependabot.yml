version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hocuspocus-and-yjs:
        patterns:
          - "@hocuspocus/*"
          - "yjs"
          - "y-*"
      tiptap:
        patterns:
          - "@tiptap/*"
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
