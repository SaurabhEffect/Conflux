# Dependabot: one pull request a week with every update in it.

version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tests/e2e
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
